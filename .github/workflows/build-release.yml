name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Prepare release signing key
        env:
          FAKESCREEN_KEYSTORE_BASE64: ${{ secrets.FAKESCREEN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FAKESCREEN_KEYSTORE_BASE64"
          printf '%s' "$FAKESCREEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fakescreen-release.p12"
          chmod 600 "$RUNNER_TEMP/fakescreen-release.p12"

      - name: Build release APK
        env:
          FAKESCREEN_KEYSTORE_FILE: ${{ runner.temp }}/fakescreen-release.p12
          FAKESCREEN_KEYSTORE_PASSWORD: ${{ secrets.FAKESCREEN_KEYSTORE_PASSWORD }}
        run: bash ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Verify release signing certificate
        run: |
          set -euo pipefail
          actual=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ && !found { print tolower($NF); found=1 }')
          expected=9e1b1b684de60cc12a8e9911f0af77f2253333c65e05d2c5a2b65e08788fce97
          if [[ "$actual" != "$expected" ]]; then
            echo 'Release signing certificate does not match the expected key.' >&2
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fakeScreen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: fakeScreen-release-apk
          path: release-assets

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.apk
          body: |
            按键和显示恢复行为依赖设备及系统，请先阅读 README 中的兼容性和恢复说明。

            本版应用包名为 com.godmiracle.fakescreen。更换包名时需先导出旧版日志，并停用旧模块；之后同一签名的版本可覆盖升级。
          generate_release_notes: true
