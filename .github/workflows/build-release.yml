name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build release APK
        run: bash ./gradlew --no-daemon clean assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fakeScreen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: fakeScreen-release-apk
          path: release-assets

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.apk
          generate_release_notes: true
